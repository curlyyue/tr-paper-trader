<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TR Paper Trader</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0f1117; --card: #181b23; --border: #262a35; --text: #e6e8ee;
    --muted: #8b91a0; --green: #34d399; --red: #f87171; --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 10px; color: var(--accent); }
  h3 { font-size: 14px; margin: 18px 0 8px; }
  .muted { color: var(--muted); font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 10px; padding: 16px; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px;
          border: 1px solid var(--border); color: var(--muted); }
  .buy { color: var(--green); } .sell { color: var(--red); }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); }
  .decision { border-left: 3px solid var(--accent); padding: 8px 12px; margin: 10px 0;
              background: rgba(122,162,247,.05); border-radius: 0 8px 8px 0; }
  .reason { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .tab { padding: 6px 16px; border-radius: 8px; border: 1px solid var(--border);
         background: var(--card); color: var(--text); cursor: pointer; font-size: 14px; }
  .tab.active { background: var(--accent); color: #0f1117; border-color: var(--accent); }
  .langswitch { display: flex; gap: 4px; }
  .langbtn { padding: 4px 12px; border-radius: 7px; border: 1px solid var(--border);
             background: var(--card); color: var(--muted); cursor: pointer; font-size: 13px; }
  .langbtn.active { background: var(--accent); color: #0f1117; border-color: var(--accent); }
  canvas { max-height: 320px; }
  .newsitem { padding: 3px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: rgba(122,162,247,.08); }
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
                     z-index: 100; align-items: flex-start; justify-content: center;
                     overflow-y: auto; padding: 40px 16px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
           padding: 20px; max-width: 720px; width: 100%; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 20px;
                 cursor: pointer; line-height: 1; padding: 0 4px; }
  .modal-close:hover { color: var(--text); }
  .modal h2 { margin: 0 0 2px; font-size: 18px; color: var(--text); }
  .rangebar { display: flex; gap: 6px; margin: 14px 0 10px; }
  .rangebtn { padding: 4px 12px; border-radius: 7px; border: 1px solid var(--border);
              background: var(--bg); color: var(--muted); cursor: pointer; font-size: 12.5px; }
  .rangebtn.active { background: var(--accent); color: #0f1117; border-color: var(--accent); }
  .modal canvas { max-height: 280px; }
  .modal table { margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>TR Paper Trader</h1>
      <div class="muted" id="meta"></div>
    </div>
    <div class="langswitch">
      <button class="langbtn" data-lang="en">EN</button>
      <button class="langbtn" data-lang="zh">中文</button>
    </div>
  </div>

  <h2 id="t-navtitle"></h2>
  <div class="card"><canvas id="navChart"></canvas></div>
  <div class="card" id="compareTable"></div>

  <div class="tabs" id="tabs"></div>
  <div id="agentView"></div>
</div>

<div class="modal-backdrop" id="stockModalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="modalTicker"></h2>
        <div class="muted" id="modalSub"></div>
      </div>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="rangebar" id="modalRangeBar"></div>
    <canvas id="modalChart"></canvas>
    <h3 id="modalTradesTitle"></h3>
    <div id="modalTrades"></div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/;

const I18N = {
  en: {
    meta_pre: "Prices & data as of ", meta_suf: " · re-run dashboard.py to refresh",
    navtitle: "NAV comparison (all agents)",
    c_agent: "agent", c_nav: "NAV", c_cash: "cash", c_posval: "positions",
    c_deposited: "deposited", c_fees: "fees", c_return: "return",
    pos_title: "Positions — ", c_stock: "stock", c_qty: "qty", c_avgcost: "avg cost",
    c_price: "price", c_value: "value", c_pnl: "P/L", empty_pos: "(no positions)",
    dec_title: "Daily decisions (analysis / reasoning / orders)",
    l_analysis: "Analysis", l_reasoning: "Full reasoning", l_memo: "📝 Memo to future self",
    l_orders: "Orders", hold: "Chose to hold — no orders", rec: "★ Recommends watching: ",
    trades_title: "Trade log", c_time: "time", c_side: "side", c_reason: "reason",
    empty_trades: "(no trades)", shares: " sh",
    modal_trades: "Trades", modal_notrades: "(no trades for this stock yet)",
    modal_noprice: "(no price history available)", modal_avg: "avg cost ",
    r_1w: "1W", r_1m: "1M", r_3m: "3M", r_6m: "6M", r_1y: "1Y", r_max: "MAX",
    disc_title: "Agent-discovered stocks (recommendations)", empty_disc: "(none yet)",
    news_title: "News the agent saw (archive)", news_market: "market",
    empty_news: "(archived from the next run on)", added: "added ", no_dec: "(no decisions yet)",
  },
  zh: {
    meta_pre: "价格与数据截至 ", meta_suf: " · 重新运行 dashboard.py 刷新",
    navtitle: "NAV 对比(所有 agent)",
    c_agent: "agent", c_nav: "NAV", c_cash: "现金", c_posval: "持仓市值",
    c_deposited: "累计入金", c_fees: "手续费", c_return: "总收益",
    pos_title: "持仓 — ", c_stock: "股票", c_qty: "数量", c_avgcost: "成本价",
    c_price: "现价", c_value: "市值", c_pnl: "持仓涨幅", empty_pos: "(空仓)",
    dec_title: "每日决策(分析 / 推理 / 订单)",
    l_analysis: "分析", l_reasoning: "完整推理过程", l_memo: "📝 给未来自己的备忘",
    l_orders: "订单", hold: "当日选择观望,无订单", rec: "★ 推荐加入观察:",
    trades_title: "交易记录", c_time: "时间", c_side: "方向", c_reason: "理由",
    empty_trades: "(无交易)", shares: " 股",
    modal_trades: "交易记录", modal_notrades: "(该股票暂无交易)",
    modal_noprice: "(暂无价格历史数据)", modal_avg: "平均成本 ",
    r_1w: "1周", r_1m: "1月", r_3m: "3月", r_6m: "6月", r_1y: "1年", r_max: "最大",
    disc_title: "Agent 发现的股票(推荐)", empty_disc: "(暂无)",
    news_title: "Agent 看到的新闻(存档)", news_market: "市场",
    empty_news: "(下次运行起开始存档)", added: "加入于 ", no_dec: "(暂无决策记录)",
  },
};

let LANG = localStorage.getItem("tr_lang") || "en";
const t = k => I18N[LANG][k];

const fmt = (n, d=2) => n == null ? "–" : n.toLocaleString("de-DE", {minimumFractionDigits: d, maximumFractionDigits: d});
const cls = n => n == null ? "" : (n >= 0 ? "pos" : "neg");
const sign = n => n == null ? "–" : (n >= 0 ? "+" : "") + fmt(n);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// --- comparison chart (built once; labels don't need re-render) ---
const palette = ["#7aa2f7", "#e0af68", "#9ece6a", "#f7768e", "#bb9af7"];
new Chart(document.getElementById("navChart"), {
  type: "line",
  data: {
    labels: [...new Set(DATA.agents.flatMap(a => a.nav_history.map(h => h.date)))].sort(),
    datasets: DATA.agents.map((a, i) => ({
      label: a.name,
      data: a.nav_history.map(h => ({x: h.date, y: h.nav})),
      borderColor: palette[i % palette.length],
      backgroundColor: palette[i % palette.length],
      tension: .25, pointRadius: 3,
    })),
  },
  options: {
    parsing: {xAxisKey: "x", yAxisKey: "y"},
    scales: {
      x: {type: "category", grid: {color: "#262a35"}, ticks: {color: "#8b91a0"}},
      y: {grid: {color: "#262a35"}, ticks: {color: "#8b91a0", callback: v => fmt(v,0) + " €"}},
    },
    plugins: {legend: {labels: {color: "#e6e8ee"}}},
  },
});

// --- tabs ---
let activeAgent = DATA.agents.length ? DATA.agents[0] : null;
const tabsEl = document.getElementById("tabs");
DATA.agents.forEach((a, i) => {
  const b = document.createElement("button");
  b.className = "tab" + (i === 0 ? " active" : "");
  b.textContent = a.name;
  b.onclick = () => { document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
                      b.classList.add("active"); activeAgent = a; render(); };
  tabsEl.appendChild(b);
});

function renderCompare() {
  document.getElementById("compareTable").innerHTML = `
    <table><tr><th>${t("c_agent")}</th><th class="num">${t("c_nav")}</th><th class="num">${t("c_cash")}</th>
    <th class="num">${t("c_posval")}</th><th class="num">${t("c_deposited")}</th>
    <th class="num">${t("c_fees")}</th><th class="num">${t("c_return")}</th></tr>
    ${DATA.agents.map(a => `<tr>
      <td><b>${esc(a.name)}</b></td>
      <td class="num">${fmt(a.nav)} €</td>
      <td class="num">${fmt(a.cash)} €</td>
      <td class="num">${fmt(a.positions_value)} €</td>
      <td class="num">${fmt(a.deposits)} €</td>
      <td class="num">${fmt(a.fees)} €</td>
      <td class="num ${cls(a.return_pct)}">${sign(a.return_pct)}%</td>
    </tr>`).join("")}</table>`;
}

function render() {
  document.getElementById("meta").textContent = t("meta_pre") + DATA.generated_at + t("meta_suf");
  document.getElementById("t-navtitle").textContent = t("navtitle");
  renderCompare();

  const el = document.getElementById("agentView");
  const a = activeAgent;
  if (!a) { el.innerHTML = ""; return; }
  el.innerHTML = `
    <h2>${t("pos_title")}${esc(a.name)}</h2>
    <div class="card">
      ${a.positions.length ? `<table>
        <tr><th>${t("c_stock")}</th><th class="num">${t("c_qty")}</th><th class="num">${t("c_avgcost")}</th>
        <th class="num">${t("c_price")}</th><th class="num">${t("c_value")}</th><th class="num">${t("c_pnl")}</th></tr>
        ${a.positions.map(p => `<tr class="clickable" onclick="openStockModal('${esc(p.ticker)}')">
          <td><b>${esc(p.ticker)}</b></td>
          <td class="num">${fmt(p.qty, 4)}</td>
          <td class="num">${fmt(p.avg_cost)} €</td>
          <td class="num">${fmt(p.price)} €</td>
          <td class="num">${fmt(p.value)} €</td>
          <td class="num ${cls(p.pnl_pct)}"><b>${sign(p.pnl_pct)}%</b></td>
        </tr>`).join("")}</table>` : `<span class="muted">${t("empty_pos")}</span>`}
    </div>

    <h2>${t("dec_title")}</h2>
    ${a.decisions.map(d => {
      const dc = d[LANG] || d.en || d.zh || {};   // agent content follows the language toggle
      const orders = dc.orders || [];
      const adds = (dc.watchlist_changes && dc.watchlist_changes.add) || [];
      return `
      <div class="card">
        <span class="pill">${esc(d.created_at || d.date)}</span>
        <span class="pill">${esc(d.model || "")}</span>
        <div class="decision"><b>${t("l_analysis")}</b><br>${esc(dc.analysis)}</div>
        ${dc.reasoning ? `<details open><summary>${t("l_reasoning")}</summary>
          <div class="decision">${esc(dc.reasoning)}</div></details>` : ""}
        ${dc.memo ? `<div class="decision"><b>${t("l_memo")}</b><br>${esc(dc.memo)}</div>` : ""}
        ${orders.length ? `<h3>${t("l_orders")}</h3>${orders.map(o => `
          <div>· <b class="${o.action}">${o.action.toUpperCase()}</b> ${esc(o.ticker)}
          ${o.eur ? fmt(o.eur) + " €" : ""}${o.qty ? esc(String(o.qty)) + t("shares") : ""}
          <div class="reason">${esc(o.reason)}</div></div>`).join("")}`
          : `<div class="muted">${t("hold")}</div>`}
        ${adds.map(w =>
          `<div>${t("rec")}<b>${esc(w.ticker)}</b> <span class="reason">${esc(w.reason)}</span></div>`).join("")}
      </div>`; }).join("") || `<div class="card muted">${t("no_dec")}</div>`}

    <h2>${t("trades_title")}</h2>
    <div class="card">
      ${a.trades.length ? `<table>
        <tr><th>${t("c_time")}</th><th>${t("c_side")}</th><th>${t("c_stock")}</th><th class="num">${t("c_qty")}</th>
        <th class="num">${t("c_price")}</th><th>${t("c_reason")}</th></tr>
        ${a.trades.map(tr => `<tr class="clickable" onclick="openStockModal('${esc(tr.ticker)}')">
          <td class="muted">${esc(tr.executed_at).replace("T", " ")}</td>
          <td class="${tr.side}"><b>${tr.side.toUpperCase()}</b></td>
          <td>${esc(tr.ticker)}</td>
          <td class="num">${fmt(tr.qty, 4)}</td>
          <td class="num">${fmt(tr.price)} €</td>
          <td class="reason">${esc(tr.reason)}</td>
        </tr>`).join("")}</table>` : `<span class="muted">${t("empty_trades")}</span>`}
    </div>

    <h2>${t("disc_title")}</h2>
    <div class="card">
      ${a.watchlist.length ? a.watchlist.map(w =>
        `<div>★ <b>${esc(w.ticker)}</b> <span class="pill">${t("added")}${esc(w.added_at.slice(0,10))}</span>
         <div class="reason">${esc(w.reason)}</div></div>`).join("")
       : `<span class="muted">${t("empty_disc")}</span>`}
    </div>

    <h2>${t("news_title")}</h2>
    <div class="card">
      ${a.news.length ? a.news.map(n =>
        `<div class="newsitem"><span class="pill">${esc(n.ticker) || t("news_market")}</span> ${esc(n.headline)}</div>`).join("")
       : `<span class="muted">${t("empty_news")}</span>`}
    </div>`;
}

// --- stock detail modal ---
const RANGES = [
  {key: "1w", days: 7}, {key: "1m", days: 30}, {key: "3m", days: 90},
  {key: "6m", days: 180}, {key: "1y", days: 365}, {key: "max", days: Infinity},
];
let modalChart = null;
let modalState = null; // {ticker, history, trades, range}

function openStockModal(ticker) {
  const history = DATA.price_history[ticker] || [];
  const trades = (activeAgent ? activeAgent.trades : []).filter(tr => tr.ticker === ticker);
  const pos = activeAgent ? activeAgent.positions.find(p => p.ticker === ticker) : null;
  modalState = {ticker, history, trades, range: "1y"};
  document.getElementById("modalTicker").textContent = ticker;
  document.getElementById("modalSub").textContent = pos
    ? `${t("modal_avg")}${fmt(pos.avg_cost)} € · ${fmt(pos.qty, 4)}${t("shares")}` : "";
  document.getElementById("modalRangeBar").innerHTML = RANGES.map(r =>
    `<button class="rangebtn${r.key === modalState.range ? " active" : ""}" data-range="${r.key}">${t("r_" + r.key)}</button>`
  ).join("");
  document.querySelectorAll("#modalRangeBar .rangebtn").forEach(b =>
    b.onclick = () => { modalState.range = b.dataset.range;
      document.querySelectorAll("#modalRangeBar .rangebtn").forEach(x => x.classList.remove("active"));
      b.classList.add("active"); renderModalChart(); });
  renderModalChart();
  renderModalTrades();
  document.getElementById("stockModalBackdrop").classList.add("open");
}

function closeStockModal() {
  document.getElementById("stockModalBackdrop").classList.remove("open");
}
document.getElementById("modalClose").onclick = closeStockModal;
document.getElementById("stockModalBackdrop").onclick = e => {
  if (e.target.id === "stockModalBackdrop") closeStockModal();
};

function renderModalChart() {
  const {history, trades, range} = modalState;
  const days = RANGES.find(r => r.key === range).days;
  const cutoff = days === Infinity ? null
    : new Date(Date.now() - days * 86400000).toISOString().slice(0, 10);
  const points = cutoff ? history.filter(h => h.date >= cutoff) : history;
  const labels = points.map(h => h.date);
  const labelSet = new Set(labels);

  const buys = trades.filter(tr => tr.side === "buy" && labelSet.has(tr.executed_at.slice(0, 10)))
    .map(tr => ({x: tr.executed_at.slice(0, 10), y: tr.price, tr}));
  const sells = trades.filter(tr => tr.side === "sell" && labelSet.has(tr.executed_at.slice(0, 10)))
    .map(tr => ({x: tr.executed_at.slice(0, 10), y: tr.price, tr}));

  if (modalChart) modalChart.destroy();
  const ctx = document.getElementById("modalChart");
  if (!points.length) {
    ctx.getContext("2d").clearRect(0, 0, ctx.width, ctx.height);
    modalChart = null;
    return;
  }
  modalChart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: modalState.ticker, data: points.map(h => h.close),
          borderColor: "#7aa2f7", backgroundColor: "rgba(122,162,247,.12)",
          fill: true, tension: .2, pointRadius: 0, borderWidth: 2, order: 3,
        },
        {
          type: "scatter", label: "buy", data: buys,
          backgroundColor: "#34d399", pointStyle: "triangle", rotation: 0,
          pointRadius: 6, pointHoverRadius: 8, showLine: false, order: 1,
        },
        {
          type: "scatter", label: "sell", data: sells,
          backgroundColor: "#f87171", pointStyle: "triangle", rotation: 180,
          pointRadius: 6, pointHoverRadius: 8, showLine: false, order: 2,
        },
      ],
    },
    options: {
      parsing: {xAxisKey: "x", yAxisKey: "y"},
      scales: {
        x: {type: "category", grid: {color: "#262a35"}, ticks: {color: "#8b91a0", maxTicksLimit: 10}},
        y: {grid: {color: "#262a35"}, ticks: {color: "#8b91a0", callback: v => fmt(v, 2) + " €"}},
      },
      plugins: {
        legend: {display: false},
        tooltip: {
          callbacks: {
            label: ctx => {
              const tr = ctx.raw && ctx.raw.tr;
              if (tr) return `${tr.side.toUpperCase()} ${fmt(tr.qty, 4)} @ ${fmt(tr.price)} €`
                + (tr.reason ? ` — ${tr.reason}` : "");
              return `${fmt(ctx.parsed.y)} €`;
            },
          },
        },
      },
    },
  });
}

function renderModalTrades() {
  document.getElementById("modalTradesTitle").textContent = t("modal_trades");
  const {trades} = modalState;
  document.getElementById("modalTrades").innerHTML = trades.length ? `<table>
    <tr><th>${t("c_time")}</th><th>${t("c_side")}</th><th class="num">${t("c_qty")}</th>
    <th class="num">${t("c_price")}</th><th>${t("c_reason")}</th></tr>
    ${trades.map(tr => `<tr>
      <td class="muted">${esc(tr.executed_at).replace("T", " ")}</td>
      <td class="${tr.side}"><b>${tr.side.toUpperCase()}</b></td>
      <td class="num">${fmt(tr.qty, 4)}</td>
      <td class="num">${fmt(tr.price)} €</td>
      <td class="reason">${esc(tr.reason)}</td>
    </tr>`).join("")}</table>` : `<span class="muted">${t("modal_notrades")}</span>`;
}

// --- language switch ---
function setLang(lang) {
  LANG = lang;
  localStorage.setItem("tr_lang", lang);
  document.querySelectorAll(".langbtn").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === lang));
  document.documentElement.lang = lang === "zh" ? "zh" : "en";
  render();
}
document.querySelectorAll(".langbtn").forEach(b => b.onclick = () => setLang(b.dataset.lang));

setLang(LANG);
</script>
</body>
</html>
